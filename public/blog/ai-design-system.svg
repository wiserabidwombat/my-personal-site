<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" preserveAspectRatio="xMidYMid slice">
  <!-- Colors are the site's theme tokens (with the default palette as the
       fallback), so the art follows light/dark mode and the Halloween theme
       when the site renders it inline. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" style="stop-color: var(--deep-space-purple, #150a24)"/>
      <stop offset="100%" style="stop-color: var(--deep-space-black, #0a0612)"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" style="stop-color: var(--neon-pink, #ff2bd6)"/>
      <stop offset="100%" style="stop-color: var(--laser-cyan, #00f0ff)"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <g style="stroke: var(--laser-cyan, #00f0ff)" stroke-opacity="0.35" stroke-width="1">
    <line x1="0" y1="60" x2="640" y2="60"/>
    <line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
    <line x1="107" y1="0" x2="107" y2="360"/>
    <line x1="214" y1="0" x2="214" y2="360"/>
    <line x1="321" y1="0" x2="321" y2="360"/>
    <line x1="428" y1="0" x2="428" y2="360"/>
    <line x1="535" y1="0" x2="535" y2="360"/>
  </g>
  <circle cx="320" cy="180" r="70" fill="none" stroke="url(#glow)" stroke-width="4"/>
  <circle cx="320" cy="180" r="30" fill="url(#glow)"/>
  <path d="M320 110 L320 40 M320 250 L320 320 M250 180 L180 180 M390 180 L460 180" stroke="url(#glow)" stroke-width="3" stroke-linecap="round"/>
</svg>
