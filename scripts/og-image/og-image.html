<!doctype html>
<!--
  Source for public/og-image.png, the 1200x630 link-preview banner.
  Regenerate with `npm run og:image` (see scripts/og-image/render.mjs).
  Colors are the dark-theme synthwave tokens from src/index.css, and the
  font stack matches its --heading/--sans.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG image</title>
    <style>
      :root {
        --deep-space-black: #0a0612;
        --neon-pink: #ff2bd6;
        --cyber-purple: #8b2fe0;
        --laser-cyan: #00f0ff;
        --slate-300: #cbd5e1;
        --heading: system-ui, 'Segoe UI', Roboto, sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--deep-space-black);
      }

      .banner {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: var(--heading);
        text-align: center;
      }

      /* Magenta glow above the horizon, cut off sharply at the horizon line. */
      .sky {
        position: absolute;
        inset: 20px 20px auto;
        height: 265px;
        border-radius: 30px 30px 0 0;
        background: radial-gradient(
          ellipse 640px 330px at 50% 100%,
          color-mix(in oklab, var(--neon-pink) 40%, transparent),
          transparent 100%
        );
      }

      /* Perspective floor grid, same construction as bg-synth-grid. */
      .floor {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 330px;
        background-image:
          linear-gradient(color-mix(in oklab, var(--laser-cyan) 60%, transparent) 1px, transparent 1px),
          linear-gradient(90deg, color-mix(in oklab, var(--laser-cyan) 60%, transparent) 1px, transparent 1px);
        background-size: 60px 60px;
        background-position: 0 0;
        transform: perspective(300px) rotateX(65deg);
        transform-origin: bottom;
        mask-image: linear-gradient(to top, black 40%, transparent 95%);
      }

      .frame {
        position: absolute;
        inset: 18px 18px 18px;
        border: 2px solid color-mix(in oklab, var(--cyber-purple) 50%, transparent);
        border-radius: 32px;
      }

      .eyebrow,
      .name,
      .role,
      .stack {
        position: absolute;
        left: 0;
        right: 0;
      }

      .eyebrow {
        top: 170px;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.36em;
        text-indent: 0.36em;
        color: var(--laser-cyan);
        text-shadow: 0 0 10px rgba(0, 240, 255, 0.7);
      }

      .name {
        top: 221px;
        font-size: 96px;
        font-weight: 700;
        line-height: 1.12;
        letter-spacing: 0.055em;
        text-indent: 0.055em;
        color: var(--laser-cyan);
        text-shadow:
          0 0 12px rgba(0, 240, 255, 0.8),
          0 0 36px rgba(0, 240, 255, 0.5);
      }

      .role {
        top: 348px;
        font-size: 41px;
        font-weight: 600;
        color: var(--neon-pink);
        text-shadow: 0 0 14px rgba(255, 43, 214, 0.6);
      }

      .stack {
        top: 428px;
        font-size: 23px;
        font-weight: 500;
        color: var(--slate-300);
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <div class="sky"></div>
      <div class="floor"></div>
      <div class="frame"></div>
      <p class="eyebrow">AARONTILLEY.ME</p>
      <p class="name">AARON TILLEY</p>
      <p class="role">Senior Developer</p>
      <p class="stack">React · Angular · .NET · Enterprise CRM Systems</p>
    </div>
  </body>
</html>
